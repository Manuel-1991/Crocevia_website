<!doctype html>
<title>Crocevia</title>
<meta name="description" content="Educazione cinofila, asilo diurno e pensione: due percorsi, una sola filosofia.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0d2219;
  --bg-radial: radial-gradient(ellipse 1100px 620px at 50% -12%, #172c21 0%, #0d2219 55%);
  --surface:#24352a;
  --surface-soft: rgba(36,53,42,0.55);
  --border:#3e4a31;
  --border-soft: rgba(62,74,49,0.55);
  --ink:#f4f1e4;
  --ink-muted:#b2bfb3;
  /* miele (pelo del cane) — Educazione + azioni primarie */
  --gold:#c38345;
  --gold-tint: rgba(195,131,69,0.16);
  --gold-tint-soft: rgba(195,131,69,0.09);
  /* oro (ciondolo) — Pensione & Asilo + azioni secondarie */
  --bordeaux:#efd49e;
  --bordeaux-tint: rgba(239,212,158,0.14);
  --bordeaux-tint-soft: rgba(239,212,158,0.08);
  --terracotta:#c38345;
  /* castagno — accento neutro (Chi siamo / filosofia) */
  --verde:#81522a;
  --verde-light:#c9a687;
  --verde-tint: rgba(129,82,42,0.18);
  /* bandana (oliva) — eyebrow, breadcrumb, etichette */
  --bandana:#82864d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg-radial), var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "EB Garamond", Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::selection{ background: var(--gold-tint); color: var(--ink); }
a{ color: var(--terracotta); text-decoration: none; }
a:hover{ color: var(--gold); }
a:focus-visible, button:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
img{ max-width:100%; }
h1,h2,h3{ font-family:"Cinzel", Georgia, serif; font-weight:700; color:#f7f1de; margin:0; text-wrap:balance; }
.wrap{ max-width: 780px; margin:0 auto; padding: 0 28px 90px; }

/* ---------- header / nav ---------- */
.site-header{
  position: sticky; top:0; z-index: 20;
  background: rgba(36,42,27,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border-soft);
}
.nav{
  max-width: 960px; margin: 0 auto; padding: 16px 28px;
  display:flex; align-items:center; justify-content:space-between; gap: 14px;
  flex-wrap: nowrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-word{
  font-family:"Cinzel", serif; font-weight:700; font-size:16px;
  letter-spacing: 0.16em; color: var(--ink);
}
.crest{ width:34px; height:34px; flex:none; }
.nav-links{
  display:flex; flex-wrap:nowrap; gap: 4px 15px; list-style:none; margin:0; padding:0;
  overflow-x:auto;
}
.nav-links a{
  font-family:"Cinzel", serif; font-size:10.5px; letter-spacing:0.06em;
  color: var(--ink-muted); text-transform: uppercase; padding: 6px 1px;
  border-bottom: 1px solid transparent; white-space:nowrap;
}
.nav-links a:hover{ color: var(--gold); }
.nav-links a.active{ color: var(--gold); border-bottom-color: var(--gold); }

/* ---------- hero / kicker ---------- */
.kicker{
  display:flex; align-items:center; justify-content:center; gap:9px;
  font-family:"Cinzel", serif; font-size:12.5px; letter-spacing:0.3em;
  color: var(--bandana); margin: 44px 0 16px; text-transform:uppercase;
}
.crumb{
  font-family:"Cinzel", serif; font-size:11.5px; letter-spacing:0.2em;
  color: var(--bandana); text-transform:uppercase; margin: 40px 0 14px;
}
.crumb a{ color: var(--bandana); border-bottom: 1px solid transparent; }
.crumb a:hover{ border-bottom-color: var(--bandana); }
.logo-nav{ display:block; height:44px; width:auto; border-radius:5px; }
.hero-badge{
  display:inline-block; background: var(--ink); border-radius:12px;
  padding:10px; box-shadow:0 16px 36px rgba(0,0,0,.4); margin:0 0 20px;
}
.logo-hero{ display:block; width:172px; height:auto; border-radius:6px; }
.page-head{ text-align:center; max-width:600px; margin:0 auto 42px; }
.page-head h1{ font-size: clamp(30px, 4.4vw, 40px); margin-bottom: 12px; }
.page-sub{
  font-style:italic; font-size:18.5px; color: var(--ink-muted); line-height:1.55; margin:0;
}
h1.left{ text-align:left; }
.page-head.left{ text-align:left; margin-left:0; }

/* ---------- ribbon cta ---------- */
.ribbon{
  font-family:"Cinzel", serif; font-weight:600; letter-spacing:0.05em;
  text-align:center; padding: 15px 34px;
  clip-path: polygon(4% 0%, 96% 0%, 100% 50%, 96% 100%, 4% 100%, 0% 50%);
  border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  background: var(--surface); color: var(--ink);
  display:block;
}
.hero-ribbon{ display:flex; justify-content:center; margin: 0 0 10px; }
.hero-ribbon .ribbon{ font-size:19px; letter-spacing:0.12em; }
.hero-sub{
  text-align:center; font-style:italic; font-size:15.5px; color: var(--ink-muted);
  margin: 0 0 40px;
}

.cta-row{ display:flex; gap:22px; margin: 0 0 46px; }
.cta-block{
  flex:1; border-radius:4px; padding: 28px 22px; text-align:center;
  transition: transform .15s ease, border-color .15s ease;
}
.cta-block:hover{ transform: translateY(-2px); }
.cta-block.edu{ background: var(--gold-tint-soft); border:1px solid rgba(212,172,87,0.55); }
.cta-block.edu:hover{ border-color: var(--gold); }
.cta-block.pen{ background: var(--bordeaux-tint-soft); border:1px solid rgba(138,58,64,0.6); }
.cta-block.pen:hover{ border-color: var(--bordeaux); }
.cta-block .t{ font-family:"Cinzel", serif; font-weight:600; font-size:16.5px; letter-spacing:0.04em; }
.cta-block.edu .t{ color: var(--gold); }
.cta-block.pen .t{ color: var(--bordeaux); }
.cta-block .s{ font-style:italic; font-size:14px; color: var(--ink-muted); margin-top:9px; }

.end-cta{
  border-radius:4px; padding: 24px; text-align:center; margin-top: 8px;
  font-family:"Cinzel", serif; font-weight:600; font-size:15px; letter-spacing:0.04em;
}
.end-cta.edu{ border:1px solid var(--gold); background: var(--gold-tint); color: var(--gold); }
.end-cta.pen{ border:1px solid var(--bordeaux); background: var(--bordeaux-tint); color: var(--bordeaux); }
.end-cta.plain{ border:1px solid var(--verde); background: var(--verde-tint); color: var(--verde-light); }
.end-cta a{ color:inherit; }

/* ---------- section cards ---------- */
.section{
  border:1px solid var(--border-soft); background: var(--surface-soft);
  border-radius:4px; padding: 26px 28px; margin-bottom: 20px;
  border-left-width: 3px;
}
.section.edu{ border-left-color: var(--gold); }
.section.pen{ border-left-color: var(--bordeaux); }
.section.verde{ border-left-color: var(--verde); }
.section h3{
  font-size:14.5px; letter-spacing:0.08em; margin-bottom:10px; text-transform:uppercase;
}
.section.edu h3{ color: var(--gold); }
.section.pen h3{ color: var(--bordeaux); }
.section.verde h3{ color: var(--verde-light); }
.section p{ margin:0; color: var(--ink); }
.section p + p{ margin-top:10px; }
.price{ font-style:normal; font-weight:600; }
.section.edu .price{ color: var(--gold); }
.section.pen .price{ color: var(--bordeaux); }

/* ---------- teaser / plain sections ---------- */
.teaser{
  border:1px solid var(--border-soft); background: var(--surface-soft);
  border-radius:4px; padding: 24px 26px; margin-bottom: 18px;
}
.teaser h3{ font-size:13.5px; letter-spacing:0.08em; margin-bottom:9px; color: var(--ink); text-transform:uppercase; }
.teaser p{ font-style:italic; color: var(--ink-muted); margin:0; }
.teaser .more{ display:inline-block; margin-top:10px; font-style:normal; font-family:"Cinzel", serif; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; }

/* ---------- dividers ---------- */
.divider{ display:flex; align-items:center; gap:16px; margin: 46px 0 26px; }
.divider .line{ flex:1; height:1px; background: var(--border-soft); }
.divider span{
  font-family:"Cinzel", serif; font-size:11.5px; letter-spacing:0.24em;
  color: var(--ink-muted); white-space:nowrap; text-transform:uppercase;
}

/* ---------- location cards (dove operiamo) ---------- */
.loc-row{ display:flex; gap:22px; margin-bottom: 10px; }
.loc-card{ flex:1; border:1px solid var(--border-soft); background: var(--surface-soft); border-radius:4px; padding:24px 22px; }
.loc-card h3{ font-size:14px; letter-spacing:0.07em; color: var(--bandana); text-transform:uppercase; margin-bottom:8px; }
.loc-card ul{ margin:12px 0 0; padding-left:18px; color: var(--ink-muted); font-size:15px; }
.loc-card li{ margin-bottom:4px; }
.note{ font-style:italic; color: var(--ink-muted); font-size:15px; text-align:center; margin-top:22px; }

/* ---------- contact ---------- */
.contact-card{
  border:1px solid var(--border-soft); background: var(--surface-soft);
  border-radius:4px; padding: 34px 30px; text-align:center;
}
.contact-line{ font-family:"Cinzel", serif; font-size:19px; letter-spacing:0.02em; margin: 14px 0; }
.contact-line a{ color: var(--ink); border-bottom: 1px solid var(--terracotta); }
.contact-line a:hover{ color: var(--gold); border-bottom-color: var(--gold); }
.contact-label{ font-size:11px; letter-spacing:0.2em; color: var(--bandana); text-transform:uppercase; font-family:"Cinzel",serif; }
.piva{ margin-top:26px; font-size:13px; color: var(--ink-muted); }

/* ---------- bio (chi siamo) ---------- */
.bio-row{ display:flex; gap:22px; margin-bottom: 8px; }
.bio-card{ flex:1; border:1px solid var(--border-soft); background: var(--surface-soft); border-radius:4px; padding:24px 22px; }
.bio-card .role{ font-family:"Cinzel", serif; font-size:11.5px; letter-spacing:0.14em; color: var(--bandana); text-transform:uppercase; margin-bottom:8px; }
.bio-card h3{ font-size:20px; margin-bottom:8px; }
.bio-card p{ color: var(--ink-muted); font-size:15px; margin:0; }
.pillars-list{ list-style:none; margin:0; padding:0; }
.pillars-list li{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border-soft); }
.pillars-list li:last-child{ border-bottom:none; }
.pillars-list .dot{ width:7px; height:7px; margin-top:8px; background:var(--verde-light); transform:rotate(45deg); flex:none; }
.pillars-list b{ color: var(--ink); }

/* ---------- footer ---------- */
.site-footer{
  border-top:1px solid var(--border-soft); margin-top: 26px;
  padding: 30px 28px 40px; text-align:center;
}
.footer-inner{ max-width:780px; margin:0 auto; }
.footer-links{ font-size:14px; color: var(--ink-muted); margin-bottom:8px; }
.footer-links a{ color: var(--ink-muted); }
.footer-links a:hover{ color:var(--gold); }
.footer-contact{ font-size:14.5px; color: var(--ink); }
.footer-contact a{ color: var(--ink); border-bottom:1px solid var(--terracotta); }
.footer-piva{ font-size:12px; color: var(--ink-muted); opacity:0.75; margin-top:12px; }

@media (max-width: 600px){
  .cta-row, .loc-row, .bio-row{ flex-direction:column; }
  .nav{ gap:10px; }
  .nav-links{ gap:4px 12px; }
}
@media (prefers-reduced-motion: reduce){
  .cta-block{ transition:none; }
}
</style>
